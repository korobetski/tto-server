[versions]
# Kept in step with the client repository (AS3-Triple-Triad), and now a hard requirement rather
# than a courtesy: `:core` is consumed as an artifact, and a Kotlin library's metadata cannot be
# read by a consumer on an older language version. The client went to 2.4.10 on 2026-08-08 and this
# followed the same day.
kotlin = "2.4.10"
serializationJson = "1.11.0"

# The client's rules engine, published from the AS3-Triple-Triad repository with
# `./gradlew :core:publishToMavenLocal`. A SNAPSHOT, and resolved from mavenLocal, until there is a
# registry to publish it to — see settings.gradle.kts.
core = "0.1.0-SNAPSHOT"

# Held in step with the client's Ktor. It was pinned at 3.3.1 by the client's Kotlin — from 3.4.0
# Ktor's Kotlin/Native klibs are compiled by Kotlin 2.3, whose ABI Kotlin 2.2.20 refused — and
# nothing here ever needed a klib, this being a JVM server. The constraint was still binding on
# *this* number, because two Ktor versions across a protocol boundary is a class of bug not worth
# the newer patch releases. Kotlin moved in both repositories on 2026-08-08 and both Ktors followed.
ktor = "3.5.2"
# Flyway needs its Postgres support in a separate artifact since v10; without it, migration fails
# at runtime with "unsupported database" rather than at compile time.
flyway = "13.2.0"
hikari = "7.1.0"
postgres = "42.7.13"
logback = "1.6.1"
micrometer = "1.17.0"
# Password hashing. A dedicated library rather than the JDK's PBKDF2, because the property that
# matters is deliberate slowness with a tunable cost, and bcrypt's cost factor is stored inside the
# digest itself — so raising it later re-hashes each password on the owner's next sign-in without a
# migration or a second column. This one is a single small artifact with no transitive dependencies.
bcrypt = "0.10.2"
# **Held at 1.x.** Testcontainers 2.0 reorganised its coordinates: `org.testcontainers:postgresql`
# and `:junit-jupiter` are not published at 2.0.5 at all, so taking it means finding and rewriting
# the module names for a test-only dependency that works. Not now.
testcontainers = "1.21.4"

ktlintPlugin = "12.1.2"
detekt = "1.23.8"

[libraries]
# The single most important dependency here. The server verifies a match by replaying it with the
# *same* engine the client played it with; a second implementation of the rules would make the two
# able to disagree, which is the one thing the design rules out. Gradle module metadata picks the
# JVM variant of this multiplatform library.
tripletriad-core = { module = "com.tripletriad:core", version.ref = "core" }

ktor-server-core ={ module = "io.ktor:ktor-server-core", version.ref = "ktor" }
# Netty rather than CIO: it is the engine Ktor's own deployment documentation is written against,
# and the one whose graceful-shutdown behaviour is best specified. Nothing here depends on the
# choice — the engine is named once, in Application.kt.
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-call-id = { module = "io.ktor:ktor-server-call-id", version.ref = "ktor" }
ktor-server-metrics-micrometer = { module = "io.ktor:ktor-server-metrics-micrometer", version.ref = "ktor" }
ktor-server-default-headers = { module = "io.ktor:ktor-server-default-headers", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgres" }

logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# The database tests run against a real Postgres in a container rather than an in-memory
# substitute. An H2 in "Postgres mode" would let a migration pass here and fail in production,
# which is the one thing a migration test exists to prevent.
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
