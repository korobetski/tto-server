[versions]
# Kept in step with the client repository (AS3-Triple-Triad). It is not a hard requirement today —
# nothing is shared yet — but it becomes one the moment `:core` is consumed as an artifact, because
# a Kotlin library and its consumer must agree on the language version.
kotlin = "2.2.20"
serializationJson = "1.9.0"

ktor = "3.5.2"
# Flyway needs its Postgres support in a separate artifact since v10; without it, migration fails
# at runtime with "unsupported database" rather than at compile time.
flyway = "13.2.0"
hikari = "7.1.0"
postgres = "42.7.13"
logback = "1.6.1"
micrometer = "1.17.0"
testcontainers = "1.21.4"

ktlintPlugin = "12.1.2"
detekt = "1.23.8"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
# Netty rather than CIO: it is the engine Ktor's own deployment documentation is written against,
# and the one whose graceful-shutdown behaviour is best specified. Nothing here depends on the
# choice — the engine is named once, in Application.kt.
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-call-id = { module = "io.ktor:ktor-server-call-id", version.ref = "ktor" }
ktor-server-metrics-micrometer = { module = "io.ktor:ktor-server-metrics-micrometer", version.ref = "ktor" }
ktor-server-default-headers = { module = "io.ktor:ktor-server-default-headers", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgres" }

logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# The database tests run against a real Postgres in a container rather than an in-memory
# substitute. An H2 in "Postgres mode" would let a migration pass here and fail in production,
# which is the one thing a migration test exists to prevent.
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
