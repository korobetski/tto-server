# The development stack: the server and the database it owns.
#
#   cp .env.sample .env
#   docker compose up -d --build
#   docker compose logs -f server
#   docker compose down          # stop, keeping data
#   docker compose down -v       # stop and DESTROY the volume
#
# This is a development topology, and it says so: the database is reachable from the host, the
# credentials are in a file everybody has, and there is no TLS. See docs/operations.md for what
# changes on a real host — the short version is that none of the three survives.

name: tto

services:
  postgres:
    # Pinned to a major version rather than `latest`: Postgres does not upgrade its data directory
    # in place, so a silent major bump leaves the volume unreadable by the new container and looks
    # exactly like data loss. MigrationTest pins the same image, on purpose.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tripletriad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - see .env.sample}
      POSTGRES_DB: ${POSTGRES_DB:-tripletriad}
      # Read by docker/postgres/init/10-app-role.sh, on first boot only. This is the role the
      # server connects as; the superuser above exists to own the cluster and to be the account
      # a human uses for psql, and the application is not a human.
      APP_DB_USER: ${DATABASE_USER:?set DATABASE_USER in .env - see .env.sample}
      APP_DB_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env - see .env.sample}
      # Read by docker/postgres/init/20-stats-role.sh, also on first boot only, and the only one of
      # these four that is allowed to be empty. Unset means "no second reader": the `stats` schema
      # is still created and `V18__stats_views.sql` still fills it, but no role exists to read it
      # from outside the server. Set it and `tto_stats` can SELECT the views and nothing else —
      # which is what a Grafana on an SSH tunnel should be connecting as.
      STATS_DB_PASSWORD: ${STATS_DB_PASSWORD:-}
    ports:
      # Loopback, not 0.0.0.0. The `5432:5432` most examples use publishes the database to every
      # machine on the network, with the development password above.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs **once**, on an empty data directory. Read-only because the container has no business
      # rewriting its own bootstrap. See the long note in 10-app-role.sh for what that implies when
      # the script changes: it does not re-run, and an existing volume has to be told separately.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` with no database name reports ready during the image's own bootstrap pass,
      # when the server is briefly up on a private socket. Naming the database makes the check mean
      # "ready for us" rather than "a postmaster is answering".
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-tripletriad} -d ${POSTGRES_DB:-tripletriad}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: .
      secrets:
        # The developer's own Gradle credentials, so the build inside the container can read
        # `com.tripletriad:core` from GitHub Packages exactly as the host build does. A secret and
        # not a build arg — see the long note in the Dockerfile for why that distinction is not
        # cosmetic.
        #
        # The path is absolute and machine-specific, which is why it lives in `.env` rather than
        # here. Compose does not expand `~`, and `${HOME}` is set by some shells on Windows and
        # not others, so guessing it would fail differently on every machine.
        - gradle_properties
    restart: unless-stopped
    depends_on:
      postgres:
        # `service_started` would not be enough: the server migrates at start-up and would exit
        # non-zero against a Postgres that has accepted the port but is still initialising. With
        # `restart: unless-stopped` that becomes a crash loop that eventually succeeds — which
        # works, and hides a real failure among the noise of a start-up that always looks broken.
        condition: service_healthy
    environment:
      TTO_ENV: development
      TTO_PORT: 8080
      # `postgres` is the service name, resolved on compose's own network. Not localhost: inside
      # the container, localhost is the container.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tripletriad}
      # The unprivileged application role, not the superuser above — see
      # docker/postgres/init/10-app-role.sh for why the two are different accounts.
      DATABASE_USER: ${DATABASE_USER:?set DATABASE_USER in .env - see .env.sample}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env - see .env.sample}
      # How this deployment describes itself on `GET /server`, and what it publishes as the
      # current client build. All optional: blank means "nothing to announce", which is the right
      # answer for a developer machine that is not shipping anything. See ServerConfig.kt.
      TTO_SERVER_NAME: ${TTO_SERVER_NAME:-Triple Triad (local)}
      TTO_CLIENT_VERSION: ${TTO_CLIENT_VERSION:-}
      TTO_CLIENT_DOWNLOAD_ANDROID: ${TTO_CLIENT_DOWNLOAD_ANDROID:-}
      TTO_CLIENT_DOWNLOAD_DESKTOP: ${TTO_CLIENT_DOWNLOAD_DESKTOP:-}
      TTO_CLIENT_DOWNLOAD_IOS: ${TTO_CLIENT_DOWNLOAD_IOS:-}
      TTO_CLIENT_NOTES: ${TTO_CLIENT_NOTES:-}
      # Blank here on purpose: a development stack sends no mail and writes the codes to
      # its log instead. `MailConfig.from` refuses that outside development. See .env.sample.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      MAIL_SENDER_NAME: ${MAIL_SENDER_NAME:-Triple Triad}
      # The first administrator, created at start-up if the name is free and left alone if it is
      # not. Blank is the steady state: they are set for one boot and cleared again. See .env.sample.
      TTO_ADMIN_USERNAME: ${TTO_ADMIN_USERNAME:-}
      TTO_ADMIN_PASSWORD: ${TTO_ADMIN_PASSWORD:-}
      # Unset means `:core`'s defaults. See Unlocks in the core package.
      TTO_UNLOCK_MULTIPLAYER: ${TTO_UNLOCK_MULTIPLAYER:-}
      TTO_UNLOCK_AUCTION: ${TTO_UNLOCK_AUCTION:-}
      # The accounts this server plays itself. Blank everywhere means off, which is the default and
      # the only safe one: a server that populates its own lobby is a different product. See
      # `docs/operations.md` for the four things to decide before setting the first of these.
      TTO_BOTS_ENABLED: ${TTO_BOTS_ENABLED:-}
      TTO_BOTS_COUNT: ${TTO_BOTS_COUNT:-}
      TTO_BOTS_BAND: ${TTO_BOTS_BAND:-}
      TTO_BOTS_FORMAT: ${TTO_BOTS_FORMAT:-}
      TTO_BOTS_NAME_PREFIX: ${TTO_BOTS_NAME_PREFIX:-}
      TTO_BOTS_WAGER: ${TTO_BOTS_WAGER:-}
      TTO_BOTS_RESERVE: ${TTO_BOTS_RESERVE:-}
      TTO_BOTS_TABLE_WAIT_SECONDS: ${TTO_BOTS_TABLE_WAIT_SECONDS:-}
      TTO_BOTS_MOVE_MIN_SECONDS: ${TTO_BOTS_MOVE_MIN_SECONDS:-}
      TTO_BOTS_MOVE_SPREAD_SECONDS: ${TTO_BOTS_MOVE_SPREAD_SECONDS:-}
      TTO_BOTS_IDLE_SECONDS: ${TTO_BOTS_IDLE_SECONDS:-}
      TTO_BOTS_TICK_SECONDS: ${TTO_BOTS_TICK_SECONDS:-}
    ports:
      - "127.0.0.1:${TTO_PORT:-8080}:8080"

  caddy:
    # Not part of the development stack, and here for exactly one reason: the routing block in
    # ./Caddyfile decides which requests belong to the portal and which belong to the API, it is
    # the single riskiest thing in the deployment, and without this service the only place to try
    # it is the VPS. Getting it wrong there breaks every installed client at once.
    #
    # Behind a profile, so `docker compose up -d` still brings up two containers and nothing more.
    # It is started deliberately, and checked deliberately:
    #
    #   docker compose --profile web up -d
    #   curl -si localhost:8081/server        # the API, reached through the proxy
    #   curl -si localhost:8081/metrics       # 404 - refused at the edge
    #   curl -si localhost:8081/fr/           # the portal, once web/portal points at a build
    #
    # See web/README.md for how to put a portal build under it.
    profiles: ["web"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    environment:
      # `http://` rather than a bare hostname, and the scheme is doing real work: an explicit
      # `http://` turns automatic HTTPS off for this site. A bare `localhost` would have Caddy mint
      # a certificate from its own internal CA and listen on 443 instead, so every check above
      # would need `curl -k` and would be testing a code path the VPS does not take.
      TTO_DOMAIN: ${TTO_DOMAIN:-http://localhost}
      # The administration console, on the same port, told apart by the Host header. Nothing in a
      # browser resolves `admin.localhost` to this container's published port on its own, so a
      # local check is `curl -H 'Host: admin.localhost' localhost:${TTO_WEB_PORT:-8081}/` — which
      # is exactly what the VPS does with a real name in front of it.
      TTO_ADMIN_DOMAIN: ${TTO_ADMIN_DOMAIN:-http://admin.localhost}
      # Nothing here renews a certificate, so this is never read. It is set because the global
      # block in the Caddyfile names it, and an unset variable there is a hard start-up failure.
      TTO_TLS_EMAIL: ${TTO_TLS_EMAIL:-dev@localhost}
    ports:
      # Loopback, and not port 80: a development machine may well have something else on 80, and
      # nothing in this file should be reachable from the network.
      - "127.0.0.1:${TTO_WEB_PORT:-8081}:80"
    volumes:
      # The same file the VPS runs, unmodified. A development Caddyfile that differed from the
      # deployed one would be testing a configuration nobody deploys.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Stands in for the directory the portal's CI fills on the VPS. Empty in a fresh clone, which
      # is a portal that answers 404 and an API that works — the correct behaviour for a host that
      # has never had a portal deployed to it.
      - ./web:/srv/web:ro

secrets:
  gradle_properties:
    file: ${GRADLE_PROPERTIES:?set GRADLE_PROPERTIES in .env - see .env.sample}

volumes:
  # A named volume, not a bind mount: Postgres requires POSIX ownership on its data directory,
  # which a bind mount from a Windows host cannot provide.
  postgres-data:
