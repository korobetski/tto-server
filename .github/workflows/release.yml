# Tag, and it is live.
#
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0
#
# ### Why a tag and not every push to main
#
# Because a deployment is a decision. `main` is where work becomes releasable; a tag is where
# somebody says this one goes out, at a moment when they are awake and looking. The cost is one
# command; what it buys is that no merge ever surprises the players mid-match.
#
# ### The shape of it
#
#   verify  →  publish  →  deploy
#
# The order is the safety property. `verify` runs the same gate as CI against the tagged commit —
# not because main was not green, but because a tag can be placed anywhere, including on a commit
# that was never on main. `publish` builds the image only after that. `deploy` pulls the image that
# was published, so what runs on the VPS is byte-for-byte what was tested, rather than a rebuild
# that resolved a dependency differently on a different afternoon.
name: Release

on:
  push:
    tags: ['v*']

# Never two deployments at once, and — unlike CI — never cancel one in flight. A cancelled run
# somewhere between `docker compose up` and the readiness gate leaves a host in a state no code
# accounted for.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  # Pushing to ghcr.io/${{ github.repository }}. Granted at the top level rather than per job
  # because `publish` needs it and nothing else here writes anything.
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew build --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/
          retention-days: 30

  publish:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      # What `deploy` puts live. A digest, not the tag: tags are mutable — anyone who can push to
      # the registry can move `v0.2.0` — and a deployment that names a digest cannot be pointed at
      # different bytes after the fact. The human-readable tags below still exist; they are just not
      # what the host resolves.
      #
      # Composed by a step rather than written here as `${{ env.IMAGE }}@...`: the `env` context is
      # not one of the contexts available to `jobs.<id>.outputs`, so that expression evaluates to a
      # bare `@sha256:...` and the failure surfaces as an unparseable image reference on the VPS.
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose the Gradle credentials
        run: |
          umask 077
          {
            echo "gpr.user=${{ github.actor }}"
            echo "gpr.key=${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}"
          } > "$RUNNER_TEMP/gradle.properties"

      # Three tags on one image. `v0.2.0` is what a human reads in a rollback, the short sha is what
      # survives a tag being deleted and re-pushed, and `latest` exists for `docker run` by hand —
      # never for the deployment, which uses the digest above.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          secret-files: |
            gradle_properties=${{ runner.temp }}/gradle.properties
          # Layer cache in the registry itself, so the Gradle dependency layer survives between
          # runs. `mode=max` caches the intermediate build stage too, which is the expensive one.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Compose the image reference
        id: reference
        run: echo "image=$IMAGE@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    # Create this environment in the repository settings and add a required reviewer to turn every
    # release into an approval prompt. Left without one it does not gate anything — it is here so
    # that the gate is a settings change rather than a workflow change, and so the deployment shows
    # up in the repository's environment history.
    environment: production
    # Every secret enters through the environment rather than through `${{ }}` inside a `run:`
    # block. Two reasons, and the first one is why this job existed for a run and a half without
    # working: an expression that expands to nothing leaves no trace — the shell simply receives one
    # argument fewer, and `ssh` answers with its usage text, which names nothing. As a variable, an
    # empty value is a value, and the preflight below can say which one. The second reason is that a
    # secret pasted straight into a command line is text the shell parses, so a stray quote or `$`
    # in it would be executed rather than sent.
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      IMAGE_REF: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # Fails before anything is attempted, naming the secret that is missing. A deployment that
      # cannot start is a five-second failure; a deployment that starts on a half-configured runner
      # is one that has already sent a tar somewhere by the time it goes wrong.
      #
      # Values are never printed — only whether each is empty. `VPS_SSH_KEY` gets one extra check,
      # because the way it fails is specific: pasted without its trailing newline, or without the
      # final `-----END OPENSSH PRIVATE KEY-----` line, OpenSSH rejects it as `invalid format` and
      # nothing in that message suggests a copy-paste.
      - name: Check the deployment secrets
        run: |
          missing=""
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty repository secrets:$missing" >&2
            echo "Set them under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          case "$VPS_SSH_KEY" in
            *"PRIVATE KEY-----"*) ;;
            *) echo "::error::VPS_SSH_KEY does not look like a private key - paste the whole file, both header lines included." >&2; exit 1 ;;
          esac
          echo "host=${VPS_HOST}, user=${VPS_USER}, port=${VPS_PORT}"

      # The private half of the key pair whose public half is in the deploy user's
      # ~/.ssh/authorized_keys on the VPS. VPS_KNOWN_HOSTS pins the host key: without it the only
      # options are refusing to connect and accepting whatever answers, and the second one means a
      # DNS or routing compromise gets handed a shell and a database password.
      #
      # `printf %s\n` rather than `echo`: a key whose final newline was lost in the paste is
      # rejected outright, and this puts it back rather than depending on how it was copied.
      - name: Configure SSH
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      # Proves the credentials before anything is sent. `BatchMode=yes` so a host key that does not
      # match the pin fails immediately instead of waiting on a prompt nobody can answer.
      - name: Check the connection
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'id && test -w /srv/tto && echo "/srv/tto is writable"'

      # The host runs the deployment topology from this repository, so it has to be the version
      # being deployed. Sent as a tar over the existing SSH connection rather than with rsync or
      # scp -r: no extra package on the VPS, and one round trip.
      #
      # Deliberately not `--delete`-style: /srv/tto also holds .env, ./backups and the volumes'
      # mount points, none of which are in the repository and all of which must survive.
      #
      # `deploy/` carries the systemd units. They are *delivered* on every release so the host has
      # the current copy, and *installed* only by hand — a release that could rewrite what runs as
      # root on a schedule is a release that could be made to.
      - name: Sync the deployment files
        run: |
          tar czf - compose.prod.yaml Caddyfile scripts docker/postgres/init deploy \
            | ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" \
                -o BatchMode=yes -o StrictHostKeyChecking=yes \
                "$VPS_USER@$VPS_HOST" \
                'tar xzf - -C /srv/tto && chmod +x /srv/tto/scripts/*.sh'

      # deploy.sh pulls, pins the digest into /srv/tto/.env, restarts, waits for /health/ready, and
      # rolls back to the previous digest if it never comes. Its exit code is this job's, so a
      # rollback shows up as a red release rather than a green one nobody looks at.
      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "/srv/tto/scripts/deploy.sh '$IMAGE_REF'"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### ${{ github.ref_name }} → $VPS_HOST"
            echo
            echo '```'
            echo "$IMAGE_REF"
            echo '```'
            echo
            echo "Rollback, on the host: \`cd /srv/tto && ./scripts/deploy.sh $IMAGE:<previous-tag>\`"
          } >> "$GITHUB_STEP_SUMMARY"
